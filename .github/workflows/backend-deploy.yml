name: Deploy Backend

on:
  push:
    branches:
      - main
      # 테스트용. develop에 merge 하기 전에 이 줄을 지운다.
      - feature/deploy-docker-compose
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2

      - name: 배포 (SSM Run Command)
        run: |
          aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/marketlit && git pull origin ${{ github.ref_name }} && docker compose up -d --build"]' \
            --region ap-northeast-2