# Alembic config. Run from `ai/` with `uv run alembic ...`.
#
# ASCII only on purpose. Alembic reads this file with the *locale* encoding,
# not UTF-8, so Korean comments here crash on a cp949 Windows shell.
# The Korean notes live in alembic/env.py, which is read as UTF-8.
#
# `sqlalchemy.url` is deliberately absent: alembic/env.py reads it from
# app.core.config.settings so that secrets stay in env vars only.

[alembic]
script_location = alembic

# Put `ai/` on sys.path so env.py can `import app`.
# pyproject sets `package = false`, so nothing installs `app` into the venv.
prepend_sys_path = .

# Revision filename. Number first so `versions/` reads in order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
