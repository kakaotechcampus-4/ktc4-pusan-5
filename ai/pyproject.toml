[project]
name = "basis-ai"
version = "0.1.0"
description = "BASIS 리포트 수집 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.31.0",
    # 뉴스 링크 본문 추출. 기사 영역 선택자를 직접 쥐려고 bs4 를 쓴다
    # (네이버 뉴스 경로는 trafilatura 를 쓴다 — services/news/content.py 참고).
    "beautifulsoup4>=4.12.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # pdftotext(poppler)가 못 읽는 PDF 가 있어서 폴백으로 둔다.
    # poppler 26.07 은 Catalog 를 못 읽고도 종료코드 0 을 준다 — pypdf 는 같은 파일을 읽는다.
    "pypdf>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.52",
    # 첨부 PDF는 MTProto 클라이언트로 받는다. 공개 채널 미리보기는 HTTP로 읽는다.
    # 1.45에서 텔레그램 객체 일부를 해석하지 못하는 사례가 확인됐다.
    # 그래서 services/analyst/telegram.py 가 우회를 두 군데 갖고 있다.
    "telethon>=1.45.0",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# network 는 실제 사이트를 연다. 기본 실행에서 빼는 이유는 남의 서버 사정에 따라
# 결과가 흔들리기 때문이다. CI 가 빨갛다고 우리 코드가 틀린 게 아닌 테스트는
# 기본 실행에 두면 안 된다. 돌리려면 `uv run pytest -m network -s`.
markers = ["network: 실제 사이트를 연다 (기본 실행에서 제외)"]
addopts = "-m 'not network'"

[tool.ruff]
target-version = "py312"
line-length = 100
