[project]
name = "basis-ai"
version = "0.1.0"
description = "BASIS 리포트 수집 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
