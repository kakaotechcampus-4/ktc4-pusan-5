[project]
name = "basis-ai"
version = "0.1.0"
description = "BASIS 리포트 수집 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # pdftotext(poppler)가 못 읽는 PDF 가 있어서 폴백으로 둔다.
    # poppler 26.07 은 Catalog 를 못 읽고도 종료코드 0 을 준다 — pypdf 는 같은 파일을 읽는다.
    "pypdf>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.52",
    # 텔레그램은 공개 API 가 없어서 MTProto 클라이언트로 붙는다.
    # 1.45 가 최신인데 텔레그램이 최근 만든 객체 몇 개를 아직 모른다.
    # 그래서 services/analyst/telegram.py 가 우회를 두 군데 갖고 있다.
    "telethon>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
