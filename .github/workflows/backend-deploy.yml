name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/backend-deploy.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 배포가 서버에서 동시에 겹쳐 돌지 않도록 줄 세운다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2

      - name: 배포 (SSM Run Command)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
          # 비어 있으면 서버에서 기본값(120초)을 쓴다. 값은 Settings > Variables 에서 바꾼다.
          DEPLOY_WAIT_TIMEOUT: ${{ vars.DEPLOY_WAIT_TIMEOUT }}
        run: |
          # 서버 명령에 그대로 끼워 넣으므로 숫자(초)만 허용한다. 서버를 건드리기 전에 여기서 막는다.
          case "$DEPLOY_WAIT_TIMEOUT" in
            *[!0-9]*) echo "::error::DEPLOY_WAIT_TIMEOUT 은 숫자(초)여야 합니다: $DEPLOY_WAIT_TIMEOUT"; exit 1 ;;
          esac
          # 트리거된 커밋(SHA)을 그대로 서버에 올린다. git pull은 그 사이 들어온 최신 커밋을 끌어올 수 있다.
          # up --wait 의 대기 시간은 기본 120초이고 DEPLOY_WAIT_TIMEOUT 변수로 바꾼다(scripts/deploy-lib.sh). 2026-11-10 배포에서 18초 걸린 것을 근거로 여유를 둔 기본값이다.
          # 올릴 때는 docker-compose.yml 의 backend healthcheck start_period 도 함께 올린다. 아래 폴링 상한(10분)을 넘기면 이 워크플로우가 먼저 포기한다.
          # scripts/deploy.sh 가 up --wait 의 시작/종료 시각(up-wait-start/end)을 stdout 에 남기므로, 이후 배포에서도 소요 시간을 볼 수 있다.
          # 아래 폴링 루프의 상한(10분)은 백업·빌드까지 포함한 전체 대기 시간을 제한한다.
          # SSM은 root로 실행되어 ubuntu 소유 저장소에서 git이 'dubious ownership'으로 거부한다(HOME도 비어 있어 전역 safe.directory가 안 먹는다).
          # 저장소 소유자인 ubuntu로 실행해 소유권 불일치 자체를 없앤다.
          # 서버에서 할 일은 scripts/deploy.sh 가 한다(백업 → 빌드 → 기동 → 실패 시 롤백). 여기서는 코드를 맞춰 호출만 한다.
          # PREV 는 reset 전 서버 HEAD 로, 마지막 성공 기록이 없을 때 백업 파일 이름에만 쓴다. (\$ 는 ubuntu 셸에서 평가)
          COMMAND="sudo -H -u ubuntu bash -c 'cd /home/ubuntu/ktc4-pusan-5 && PREV=\$(git rev-parse HEAD) && git fetch origin ${DEPLOY_SHA} && git reset --hard ${DEPLOY_SHA} && DEPLOY_WAIT_TIMEOUT=${DEPLOY_WAIT_TIMEOUT} bash scripts/deploy.sh ${DEPLOY_SHA} \$PREV'"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"${COMMAND}\"]" \
            --region ap-northeast-2 \
            --query "Command.CommandId" \
            --output text)
          echo "CommandId: $COMMAND_ID"

          # send-command는 '요청 접수'만 의미한다. 서버에서 실제 실행이 끝날 때까지 기다린다.
          # `aws ssm wait command-executed` 는 약 100초(5초 x 20회)만 기다리고 포기한다.
          # 빌드 + up --wait(healthcheck 대기)는 그보다 길 수 있어 직접 폴링한다.
          STATUS=""
          for _ in $(seq 1 120); do
            # 전송 직후에는 invocation 이 아직 없어 조회가 실패할 수 있다.
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-northeast-2 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done
          echo "status: $STATUS"

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --region ap-northeast-2 --query "StandardOutputContent" --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --region ap-northeast-2 --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::배포 실패 (status: $STATUS)"
            exit 1
          fi

      - name: Smoke test (외부 주소)
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          # 프론트가 호출하는 API 주소(VITE_API_BASE_URL)와 같은 값을 쓴다. 변수가 비어 있으면 운영 도메인으로 대체한다.
          BASE="${API_BASE_URL:-https://marketlit.duckdns.org}"
          # 끝의 슬래시를 떼서 //health 가 되는 것을 막는다.
          BASE="${BASE%/}"

          # 배포 직후 Caddy/백엔드가 잠깐 불안정할 수 있어, 최대 12회(약 1분) 재시도한다.
          check() {
            url="$1"
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
              echo "[$i] $url -> $code"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::smoke test 실패: $url"
            return 1
          }

          check "$BASE/health"
          check "$BASE/api/concepts"
