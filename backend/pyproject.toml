[project]
name = "basis-backend"
version = "0.1.0"
description = "BASIS API 서버 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "alembic>=1.13",
    # ZoneInfo("Asia/Seoul") 용. Windows 에는 시스템 시간대 DB 가 없다.
    # 뉴스 수집을 ai/ 로 옮기며 뺀 trafilatura 를 따라 설치되던 것이라 직접 적는다.
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends(...) 기본값 관용 패턴
