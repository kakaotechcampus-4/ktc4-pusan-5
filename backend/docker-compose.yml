services:
  db:
    image: postgres:17-alpine
    container_name: basis-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-basis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basis}
      POSTGRES_DB: ${POSTGRES_DB:-basis}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - basis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basis} -d ${POSTGRES_DB:-basis}"]
      interval: 5s
      timeout: 3s
      retries: 10
  
volumes:
  basis-pgdata:

